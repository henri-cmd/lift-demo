<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
#lift3d{position:fixed; inset:0; overflow:hidden; background:#000; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif; color:#eee;
  touch-action:none; user-select:none; -webkit-user-select:none}
#lift3d .css3d,#lift3d canvas.gl{position:absolute; inset:0}
#lift3d canvas.gl{z-index:1; pointer-events:none; filter:sepia(.1) saturate(1.04)}
#lift3d .css3d{z-index:0}

/* the floors: one continuous page seen through the doorway (a real DOM page placed in the 3D scene) */
#lift3d .wall{position:relative; overflow:hidden; background:#111}
#lift3d .wlight{display:none; position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply;
  background:radial-gradient(ellipse 75% 85% at 50% -5%,#fffaf2 0%,#efe8dd 38%,#b9b2a8 78%,#8f8981 100%),linear-gradient(0deg,rgba(60,55,50,.35),transparent 9%)}
#lift3d .page{position:absolute; inset:0; box-sizing:border-box; overflow:hidden; background:#111; container-type:size; color:#f2efe9; -webkit-font-smoothing:antialiased}
#lift3d .stop{position:relative}
#lift3d .hold{position:sticky}
#lift3d .floor{position:sticky; top:0; background-size:cover; background-position:center}
#lift3d .stop.gone{visibility:hidden}
#lift3d .copy{max-width:960px; margin:0 auto; padding:14cqh calc(var(--mx,0px) + 5cqw) 22cqh; box-sizing:content-box}
#lift3d .copy h1{font-size:clamp(34px,7cqw,96px); font-weight:600; letter-spacing:-.03em; line-height:1; margin:0 0 4cqh}
#lift3d .copy h2{font-size:clamp(19px,2.3cqw,30px); font-weight:500; margin:10cqh 0 2cqh}
#lift3d .copy p{font-size:clamp(15px,1.3cqw,19px); line-height:1.6; max-width:52ch; margin:0 0 2cqh; opacity:.8}
#lift3d .copy .ph{aspect-ratio:16/9; background:rgba(255,255,255,.06); border-radius:4px; margin:4cqh 0}
#lift3d .floor .hero{display:block; width:100%; height:100cqh; object-fit:cover}

/* overlays */
#lift3d .grain{position:absolute; inset:-64px; z-index:3; pointer-events:none; opacity:.07; mix-blend-mode:overlay; background-size:128px 128px; will-change:transform}
#lift3d .vig{position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(ellipse 125% 105% at 50% 45%,transparent 60%,rgba(0,0,0,.28) 100%)}
#lift3d .ui{position:absolute; z-index:5; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.85);
  font:500 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; padding:9px 13px; border-radius:20px; cursor:pointer;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
#lift3d .snd{left:16px; bottom:16px}
#lift3d .ftab{right:0; top:50%; transform:translateY(-50%); border-radius:20px 0 0 20px; border-right:0}
#lift3d .hint{left:50%; bottom:18px; transform:translateX(-50%); cursor:default; transition:opacity .6s}
#lift3d .hint.off{opacity:0}
#lift3d .tag{left:16px; top:14px; cursor:default; opacity:.55}
#lift3d.busy .ftab{opacity:.3; pointer-events:none}
#lift3d .loading{position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; background:#000;
  font:500 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase; color:#888; transition:opacity .8s}
#lift3d .loading.done{opacity:0; pointer-events:none}
</style>

/* ===== GENERATED TEXTURES ===== */
function canvasTex(w, h, draw, { srgb = true, repeat = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h, c);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;

// a height field → tangent-space normal map
function normalFromHeight(hf, w, h, strength) {
  return canvasTex(w, h, (g) => {
    const d = g.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const hx = hf[y * w + (x + 1) % w] - hf[y * w + (x - 1 + w) % w], hy = hf[((y + 1) % h) * w + x] - hf[((y - 1 + h) % h) * w + x];
      let nx = -hx * strength, ny = hy * strength, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const i = (y * w + x) * 4; d.data[i] = (nx * .5 + .5) * 255; d.data[i + 1] = (ny * .5 + .5) * 255; d.data[i + 2] = (nz * .5 + .5) * 255; d.data[i + 3] = 255;

// brushed stainless: fine directional grain (albedo, roughness, normal) plus faint smudges where hands go
function brushedSet(w, h, { smudge = 0, hand = false, wave = 0, grime = 0 } = {}) {
  const col = new Float32Array(w);   // per-column grain (brushing runs vertically)
  let v = 0; for (let x = 0; x < w; x++) { v = v * .25 + (Math.random() - .5) * .8; col[x] = v; }
  const hf = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) hf[y * w + x] = col[x] + (Math.random() - .5) * .25;
  // large soft undulations across the sheet: real door skins are never perfectly flat, so reflections wobble slightly
  for (let i = 0; i < wave; i++) {

    const x0 = Math.max(0, cx - 3.2 * r | 0), x1 = Math.min(w, cx + 3.2 * r | 0), y0 = Math.max(0, cy - 3.2 * r | 0), y1 = Math.min(h, cy + 3.2 * r | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { const d = ((x - cx) ** 2 + (y - cy) ** 2) / (r * r); hf[y * w + x] += a * Math.exp(-d); }
  }
  const blobs = []; for (let i = 0; i < smudge; i++) {
    const y = hand ? h * (.35 + Math.random() * .3) : Math.random() * h, x = hand ? (Math.random() < .7 ? w * (.82 + Math.random() * .16) : Math.random() * w) : Math.random() * w;

  }

    g.fillStyle = '#c3c5c8'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x++) { const k = col[x]; g.fillStyle = k > 0 ? `rgba(255,255,255,${Math.min(.03, k * .03)})` : `rgba(0,0,0,${Math.min(.03, -k * .03)})`; g.fillRect(x, 0, 1, h); }
    if (grime) { const gr = g.createLinearGradient(0, h, 0, h * .7); gr.addColorStop(0, `rgba(40,32,24,${grime})`); gr.addColorStop(1, 'rgba(40,32,24,0)'); g.fillStyle = gr; g.fillRect(0, h * .7, w, h * .3);
      const ge = g.createLinearGradient(w, 0, w * .96, 0); ge.addColorStop(0, `rgba(30,26,22,${grime * .8})`); ge.addColorStop(1, 'rgba(30,26,22,0)'); g.fillStyle = ge; g.fillRect(w * .96, 0, w * .04, h); }
  });
  const rough = canvasTex(w, h, (g) => {
    g.fillStyle = 'rgb(78,78,78)'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x++) { const k = col[x]; g.fillStyle = k > 0 ? `rgba(255,255,255,${Math.min(.05, k * .05)})` : `rgba(0,0,0,${Math.min(.05, -k * .05)})`; g.fillRect(x, 0, 1, h); }
    for (const [x, y, r, a] of blobs) { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, `rgba(170,170,170,${a})`); rg.addColorStop(1, 'rgba(170,170,170,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  }, { srgb: false });
  const normal = normalFromHeight(hf, w, h, 1.6);
  return { albedo, rough, normal };
}

    const x = Math.random() * 1024, y = Math.random() * 1024, r = Math.random() * 3.2 + .5; g.beginPath(); g.ellipse(x, y, r, r * (.5 + Math.random() * .5), Math.random() * 3, 0, 7); g.fill(); }
});
