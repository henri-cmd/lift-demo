<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lift — 2D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style></head><body>
<!-- LIFT — Readymag code embed. Paste into a Code widget, stretch it to full screen, keep the page one screen tall. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap" rel="stylesheet">
<style>@font-face{font-family:"DSEG7";src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2");font-display:block}
@font-face{font-family:"DSEG14";src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG14-Classic/DSEG14Classic-Bold.woff2) format("woff2");font-display:block}</style>

<div id="lift">
  <div class="cab">
    <div class="room">
      <!-- recessed doorway: doors sit behind the front wall -->
      <div class="front">
        <div class="shake">
          <div class="scroller" tabindex="-1"></div>
          <div class="landing"></div>
          <div class="door l"><i class="dsk"><i></i></i></div>
          <div class="door r"><i class="dsk"><i></i></i></div>
          <div class="frame"></div>
          <div class="flicker"></div>
        </div>
        <div class="shade"></div>
      </div>
      <div class="jamb l"></div><div class="jamb r"></div><div class="soffit"></div>
      <!-- front wall either side of the doors, flush with the header -->
      <!-- header = top of the front wall, turns with the camera -->
      <div class="hdr-bg" style="left:0.00%"></div><div class="hdr-bg" style="left:12.50%"></div><div class="hdr-bg" style="left:25.00%"></div><div class="hdr-bg" style="left:37.50%"></div><div class="hdr-bg" style="left:50.00%"></div><div class="hdr-bg" style="left:62.50%"></div><div class="hdr-bg" style="left:75.00%"></div><div class="hdr-bg" style="left:87.50%"></div>
      <div class="hdr">
        <div class="ind">
          <span class="tri d"></span><span class="tri u"></span>
          <span class="arrow"></span>
          <span class="digits"><span class="ghost"></span><span class="num"></span></span>
          <div class="lights"></div>
        </div>
      </div>
      <div class="lintel"></div><div class="trim l"></div><div class="trim r"></div><div class="trim t"></div><div class="strip l"></div><div class="strip r"><div class="panel"></div></div>
      <!-- cab interior revealed when the camera turns -->
      <div class="wall l"></div>
      <div class="wall r"></div>
      <div class="ceil"></div>
    </div>
  </div>
  <div class="lightfx"></div>
  <div class="dim"></div>
  <div class="flick"></div>
  <div class="grain"></div>
  <div class="alarmfx"></div>
  <button class="snd" type="button">Sound off</button>
  <button class="ftab" type="button" aria-label="Show the floor buttons"><span class="ftab-l"></span><span class="ftab-a">→</span></button>
  <!-- LOBBY: the site opens outside the lift -->
  <div class="lobby">
    <div class="lb-wall"></div>
    <div class="lb-plaque"><div class="lb-title"></div><div class="lb-sub"></div></div>
    <div class="lb-frame">
      <div class="lb-ind"><span class="lb-arrow"></span><span class="lb-num"></span></div>
      <div class="lb-opening">
        <div class="lb-cab"><div class="lb-light"></div><div class="lb-rail"></div></div>
        <div class="lb-door l"></div><div class="lb-door r"></div>
        <div class="lb-shade"></div>
      </div>
    </div>
    <div class="lb-call"><button class="lb-btn" type="button" aria-label="Call the lift"><span>▼</span></button><div class="lb-cap">Call</div></div>
  </div>
  <div class="hint">Scroll <span>↓</span></div>
</div>

<style>
#lift{
  --hdr-h:8.5vh;         /* height of the wall above the doors (indicator lives here) */
  --ind-size:3.6vh;      /* LED text size */
  --door-ms:950ms;       /* door speed for the button-panel ride */
  --led:#ff5a1f;
  --c:1;                 /* door closure 0 = open, 1 = shut (driven by JS) */
  position:fixed; inset:0; overflow:hidden; background:#0b0b0c; z-index:1;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:#eee;
}
#lift *{box-sizing:border-box}

/* cab fills everything below the header */
#lift .cab{position:absolute; inset:0; z-index:0}
/* 3D cab. Camera sits --p in front of the front wall (z=0). The front wall (header + side strips) is flush;
   the doorway is recessed --r behind it. Side walls/ceiling/floor run from the front wall towards the camera and
   only come into view when the camera moves. --pan slides the camera sideways to the button panel. Sizes set by JS. */
#lift .cab{perspective:var(--p,1000px); perspective-origin:50% 50%; overflow:hidden; filter:contrast(1.06) saturate(1.12); background:linear-gradient(180deg,#5a5c60,#3e4044)}
#lift .room{position:absolute; inset:0; transform-style:preserve-3d;
  transform:translateX(calc(-1 * var(--pan,0px)));
  transition:transform var(--turn-ms,900ms) cubic-bezier(.45,0,.2,1)}
#lift.rm .room{transition:none}
/* front wall (header, strips, frame, panel) faces the camera at z=0, so it lives in a flat layer that slides with the
   camera — identical on screen, and avoids browser glitches with large 3D surfaces. Only the recessed doorway is 3D. */
#lift .flat{position:absolute; inset:0; pointer-events:none; transform:translateX(calc(-1 * var(--pan,0px)));
  transition:transform var(--turn-ms,900ms) cubic-bezier(.45,0,.2,1)}
#lift.rm .flat{transition:none}
#lift .flat .strip,#lift .flat .panel{pointer-events:auto}
#lift .front{position:absolute; top:var(--hp,13vh); height:calc(100% - var(--hp,13vh)); left:var(--s,5%); width:calc(100% - 2 * var(--s,5%)); overflow:hidden;
  transform:translateZ(calc(-1 * var(--r,40px)))}
#lift .shake{position:absolute; inset:0}
/* the front wall's edges throw shadow onto the recessed doors (light from above) */
#lift .shade{position:absolute; inset:0; z-index:5; pointer-events:none;
  box-shadow:inset 0 3.2vh 3.5vh -1.6vh rgba(0,0,0,.75),inset 2.4vh 0 3vh -1.4vh rgba(0,0,0,.55),inset -2.4vh 0 3vh -1.4vh rgba(0,0,0,.55)}

/* brushed steel shared by the front wall pieces */
#lift .strip,#lift .jamb,#lift .soffit,#lift .sill,#lift .lintel{position:absolute;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 3px),linear-gradient(180deg,#a3a6aa,#c4c6c9 30%,#8e9195)}
/* front wall above the doorway (sits behind the fixed header; seen when the camera turns) */
#lift .lintel{left:100%; width:var(--ext,40vw); top:0; height:var(--hp,13vh);
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0 1px,transparent 1px calc(100% - 1px),rgba(0,0,0,.5) calc(100% - 1px)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 3px),
    linear-gradient(180deg,#9a9da1 0%,#c9cbce 45%,#8e9195 100%)}
/* ceiling: level with the top of the header, running towards the camera */
#lift .ceil{position:absolute; left:0; width:calc(100% + var(--ext,40vw)); height:var(--d,600px);
  top:0; transform-origin:50% 0; transform:rotateX(90deg);
  background:linear-gradient(90deg,transparent 47%,rgba(255,246,228,.85) 47% 53%,transparent 53%),linear-gradient(180deg,#76787c,#4d4f53)}
#lift .strip{top:var(--hp,13vh); height:160%; width:var(--s,5%); cursor:pointer}
/* wood-veneer wall pieces (texture mapped in JS so the grain lines up across pieces) */
#lift .wood{background-repeat:repeat-x !important; background-color:#1d2724 !important; box-shadow:none !important}
/* slim polished-stainless door frame */
#lift .trim{position:absolute; transform:translateZ(.6px);
  background:linear-gradient(90deg,#6f7377,#e4e6e8 35%,#a5a8ac 60%,#5d6064)}
#lift .trim.l{left:calc(var(--s,5%) - var(--t,8px)); top:calc(var(--hp,13vh) - var(--t,8px)); width:var(--t,8px); height:160%}
#lift .trim.r{left:calc(100% - var(--s,5%)); top:calc(var(--hp,13vh) - var(--t,8px)); width:var(--t,8px); height:160%;
  background:linear-gradient(90deg,#5d6064,#a5a8ac 40%,#e4e6e8 65%,#6f7377)}
#lift .trim.t{left:calc(var(--s,5%) - var(--t,8px)); top:calc(var(--hp,13vh) - var(--t,8px)); width:calc(100% - 2 * var(--s,5%) + 2 * var(--t,8px)); height:var(--t,8px);
  background:linear-gradient(180deg,#e9ebed,#9a9da1 60%,#55585c)}
#lift .strip.l{left:0; box-shadow:inset -1px 0 0 rgba(255,255,255,.35)}
#lift .strip.r{left:calc(100% - var(--s,5%)); width:calc(var(--s,5%) + var(--ext,40vw)); box-shadow:inset 1px 0 0 rgba(255,255,255,.35)}
#lift .jamb{top:var(--hp,13vh); height:160%; width:var(--r,40px)}
#lift .jamb::after{content:""; position:absolute; top:0; bottom:0; width:38%; background:linear-gradient(90deg,#000,#0b0b0c)}
#lift .jamb.l::after{right:0}
#lift .jamb.r::after{left:0; background:linear-gradient(270deg,#000,#0b0b0c)}
#lift .jamb.l{left:var(--s,5%); transform-origin:0 0; transform:rotateY(90deg); filter:brightness(.55)}
#lift .jamb.r{left:calc(100% - var(--s,5%) - var(--r,40px)); transform-origin:100% 0; transform:rotateY(-90deg); filter:brightness(.7)}
#lift .soffit{top:var(--hp,13vh); left:var(--s,5%); width:calc(100% - 2 * var(--s,5%)); height:var(--r,40px); transform-origin:50% 0; transform:rotateX(-90deg); filter:brightness(.35)}
#lift .sill{top:calc(100% - var(--r,40px)); left:var(--s,5%); width:calc(100% - 2 * var(--s,5%)); height:var(--r,40px); transform-origin:50% 100%; transform:rotateX(90deg); filter:brightness(.9)}

/* cab interior */
#lift .wall{position:absolute; top:0; height:160%; width:var(--d,600px); backface-visibility:hidden;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 3px),
    linear-gradient(180deg,rgba(255,255,255,.08),transparent 30%,transparent 75%,rgba(0,0,0,.25)),
    #6d7075; background-size:cover}
#lift .wall.r{left:calc(100% + var(--ext,40vw)); transform-origin:0 0; transform:rotateY(-90deg)}
#lift .wall.l{left:calc(-1 * var(--d,600px)); transform-origin:100% 0; transform:rotateY(90deg)}
#lift .wall.r::after,#lift .wall.l::after{content:""; position:absolute; inset:0; pointer-events:none}
#lift .wall.r::after{background:linear-gradient(90deg,rgba(0,0,0,.4),transparent 35%)}
#lift .wall.l::after{background:linear-gradient(270deg,rgba(0,0,0,.4),transparent 35%)}
#lift.turned .strip.r{cursor:default}
#lift.jolt .shake{animation:liftJolt .38s ease-out}

@keyframes liftShake{0%,100%{transform:translate(0,0)}25%{transform:translate(0,.07vh)}50%{transform:translate(.04vh,-.06vh)}75%{transform:translate(-.04vh,.05vh)}}
@keyframes liftJolt{0%{transform:none}30%{transform:translateY(.22vh)}65%{transform:translateY(-.06vh)}100%{transform:none}}

/* one continuous scrolling page behind the doors */
#lift .scroller{position:absolute; inset:0; z-index:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; outline:none}
#lift .scroller::-webkit-scrollbar{display:none}
#lift.ride .scroller{overflow:hidden}
/* each floor: outer .stop > sticky .hold (freezes the floor's last screen while doors close)
   > sticky .floor (pins the floor's top while doors open) */
#lift .stop{position:relative}
#lift .hold{position:sticky}
#lift .floor{position:sticky; top:0; background-size:cover; background-position:center}
#lift .stop.gone{visibility:hidden}
#lift .copy{max-width:960px; margin:0 auto; padding:14vh 6vw 22vh}
#lift .copy h1{font-size:clamp(40px,7vw,96px); font-weight:600; letter-spacing:-.03em; line-height:1; margin:0 0 4vh}
#lift .copy h2{font-size:clamp(20px,2.2vw,30px); font-weight:500; margin:10vh 0 2vh}
#lift .copy p{font-size:clamp(15px,1.25vw,19px); line-height:1.6; max-width:52ch; margin:0 0 2vh; opacity:.8}
#lift .floor .hero{display:block; width:100%; height:var(--sh,100vh); object-fit:cover; object-position:center}
#lift .copy .ph{aspect-ratio:16/9; background:rgba(255,255,255,.06); border-radius:4px; margin:4vh 0}

/* doors — scrubbed by scroll; pointer-events off so scrolling works through them */
#lift .door{position:absolute; top:0; height:100%; width:50.4%; z-index:1; will-change:transform; pointer-events:none; filter:brightness(1.18) contrast(1.08) saturate(.7);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.035) 1px 3px),
    linear-gradient(90deg,#868a8f,#c4c7cb 38%,#a2a6ab 62%,#7b7f84)}
#lift .door.l{left:0;  transform:translateX(calc((var(--c) - 1) * 101%)); box-shadow:inset -.25vh 0 0 rgba(0,0,0,.55),1.2vh 0 2vh rgba(0,0,0,.45)}
/* leading-edge faces give the doors thickness; their visible width follows the perspective */
#lift .door::after{content:""; position:absolute; top:0; bottom:0;
  background:linear-gradient(180deg,#5e6166,#8a8d92 40%,#4d5054); box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
#lift .door.l::after{left:100%; width:var(--edge-l,0px)}
#lift .door.r::after{right:100%; width:var(--edge-r,0px)}
#lift .door.r{right:0; transform:translateX(calc((1 - var(--c)) * 101%)); box-shadow:inset .2vh 0 0 rgba(255,255,255,.25),-1.2vh 0 2vh rgba(0,0,0,.45)}
#lift.ride .door{transition:transform var(--door-ms) cubic-bezier(.6,0,.3,1)}
/* rubber safety edge down each door's leading edge */
#lift .door::before{content:""; position:absolute; top:0; bottom:0; width:.55vh; z-index:2;
  background:linear-gradient(90deg,#232427,#3a3b3e 45%,#18191b); box-shadow:0 0 .3vh rgba(0,0,0,.5)}
#lift .door.l::before{right:0}
#lift .door.r::before{left:0}
/* door finish: fixed shading (bottom and frame corners fall into shadow) + a soft reflection of the cab that
   stays put in the room while the door slides through it, so the steel reads as metal rather than a print */
#lift .door .dsk{position:absolute; inset:0; overflow:hidden; pointer-events:none;
  box-shadow:inset 0 -9vh 9vh -5vh rgba(20,14,10,.45),inset 0 5vh 6vh -4vh rgba(0,0,0,.25)}
#lift .door.l .dsk{background:linear-gradient(90deg,rgba(0,0,0,.28),transparent 14%)}
#lift .door.r .dsk{background:linear-gradient(270deg,rgba(0,0,0,.28),transparent 14%)}
#lift .door .dsk > i{position:absolute; top:0; bottom:0; width:198.4%; mix-blend-mode:soft-light; opacity:.9;
  background:
    linear-gradient(180deg,transparent 55%,rgba(255,250,240,.18) 59.5%,transparent 64%),
    linear-gradient(180deg,rgba(255,236,205,.35),transparent 22%,transparent 72%,rgba(0,0,0,.55)),
    linear-gradient(90deg,rgba(0,0,0,.5) 0%,transparent 10%,rgba(255,238,214,.45) 20%,rgba(255,238,214,.1) 27%,rgba(0,0,0,.25) 37%,
      rgba(40,30,24,.6) 47%,rgba(40,30,24,.55) 53%,rgba(0,0,0,.25) 63%,rgba(255,238,214,.1) 73%,rgba(255,238,214,.45) 80%,transparent 90%,rgba(0,0,0,.5) 100%)}
#lift .door.l .dsk > i{left:0; transform:translateX(calc((1 - var(--c)) * 50.9%))}
#lift .door.r .dsk > i{right:0; transform:translateX(calc((var(--c) - 1) * 50.9%))}
/* the landing seen through the doorway: its entrance frame in shadow around the edges, the landing header
   darkening the top — so the floor
   reads as a room beyond the doors instead of a picture stuck behind them */
#lift .landing{position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(90deg,#0c0c0d 0,#1d1e20 1.6%,rgba(220,214,204,.5) 1.8%,rgba(0,0,0,.35) 2.05%,transparent 5%),
    linear-gradient(270deg,#0c0c0d 0,#1d1e20 1.6%,rgba(220,214,204,.4) 1.8%,rgba(0,0,0,.35) 2.05%,transparent 5%),
    linear-gradient(180deg,#0a0a0b 0,#18191b 2.4vh,rgba(200,194,186,.45) 2.65vh,rgba(0,0,0,.45) 2.95vh,transparent 11vh)}
#lift.rm .door{transition:none}

#lift .frame{position:absolute; inset:0; z-index:2; background-size:cover; background-position:center; pointer-events:none}
#lift .flicker{position:absolute; inset:0; z-index:3; background:#000; opacity:0; pointer-events:none}

@keyframes liftFlick{0%{opacity:0}61%{opacity:.07}63%{opacity:0}64%{opacity:.04}66%{opacity:0}}

/* floor-indicator header — always visible */
#lift .hdr{position:absolute; left:calc(50% - 18vh); width:36vh; top:0; height:var(--hdr-h); transform:translateZ(1px);
  display:flex; flex-direction:column; gap:0; align-items:center; justify-content:center;
  padding-top:var(--overscan,.9vh); box-sizing:border-box}   /* centre in the visible strip (cab is slightly zoomed to hide edges) */
/* header plate drawn in four pieces: browsers can drop part of one very wide surface when it turns in 3D */
#lift .hdr-bg{position:absolute; top:0; width:12.75%; height:var(--hdr-h);
  /* gradients sized to the full header width and offset per piece, so the brushing runs on without seams */
  background:
    linear-gradient(180deg,rgba(255,255,255,.35) 0 1px,transparent 1px calc(100% - 1px),rgba(0,0,0,.5) calc(100% - 1px)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 3px),
    linear-gradient(180deg,#9a9da1 0%,#c9cbce 45%,#8e9195 100%);
  background-size:393.7% 100%}
#lift .hdr-bg:nth-of-type(1){background-position:0 0}
#lift .hdr-bg:nth-of-type(2){background-position:33.6% 0}
#lift .hdr-bg:nth-of-type(3){background-position:67.1% 0}
#lift .hdr-bg:nth-of-type(4){background-position:100% 0}
#lift.has-header .hdr-bg{background-size:393.7% 100%}
/* indicator plate: photo of the plate, live seven-segment number in its window, triangles light up */
#lift .ind{position:relative; width:var(--ind-w,21vh); aspect-ratio:4128/1024; border-radius:.15vh; background:var(--ind-img) center/100% 100% no-repeat;
  box-shadow:0 .2vh .45vh rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
#lift .ind .digits{position:absolute; left:19.26%; top:29.3%; width:61.56%; height:41.6%; display:flex; align-items:center; justify-content:center;
  font-family:"DSEG14","DSEG7",ui-monospace,monospace; font-size:var(--ind-fs,1.55vh); line-height:1; letter-spacing:.06em;
  color:#ff2a1e; text-shadow:0 0 .12em rgba(255,40,30,.9),0 0 .4em rgba(255,40,30,.45)}
#lift .ind .ghost{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,40,30,.07); text-shadow:none}
#lift .ind .num{position:relative; white-space:pre}
#lift .ind .arrow{display:none}
#lift .tri{position:absolute; opacity:0; transition:opacity .25s;
  background:radial-gradient(circle at 50% 60%,#fffdf4,#fff1c8 70%); filter:drop-shadow(0 0 .5vh rgba(255,240,200,.9))}
#lift .tri.d{left:5.96%; top:40.2%; width:8.94%; height:19.4%; clip-path:polygon(0 0,100% 0,50% 100%)}
#lift .tri.u{left:85.17%; top:40.2%; width:8.94%; height:19.4%; clip-path:polygon(50% 0,100% 100%,0 100%)}
#lift .tri.on{opacity:1}
#lift.moving .tri.on{animation:liftBlink 1s steps(1) infinite}
/* row of floor lamps under the display: left → right = lowest → highest floor */
#lift .lights{position:absolute; left:19.26%; width:61.56%; top:78%; height:14%; display:flex; align-items:center; justify-content:center; gap:5%}
#lift .lamp{height:62%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#4a2018,#1c0b07 70%); box-shadow:0 0 0 .1vh rgba(0,0,0,.55),inset 0 .08vh .15vh rgba(0,0,0,.8),0 .06vh 0 rgba(255,255,255,.5);
  transition:background .25s,box-shadow .25s}
#lift .lamp.on{background:radial-gradient(circle at 40% 35%,#ffd0b0,#ff3a24 60%);
  box-shadow:0 0 0 .1vh rgba(0,0,0,.55),0 0 .5vh rgba(255,60,31,.9),0 0 1.1vh rgba(255,60,31,.45)}
#lift .arrow{font-size:.6em; min-width:1em; opacity:0; transition:opacity .25s}
#lift .arrow.on{opacity:1}
#lift.moving .arrow.on{animation:liftBlink 1s steps(1) infinite}
@keyframes liftBlink{50%{opacity:.25}}

/* button panel — the full ride lives here */
#lift .panel{position:absolute; left:calc(var(--s,5%) + var(--panel-off,6vw)); top:calc(var(--panel-y,50vh) - var(--hp,13vh)); transform:translateY(-50%);
  display:grid; grid-template-columns:repeat(var(--cols,4),auto); gap:1.8vh 2vh; padding:3.4vh 3vh 3.1vh; border-radius:.5vh;
  /* brushed stainless cover plate, flush-mounted with a slight bevel */
  background:var(--plate-img, linear-gradient(115deg,#4a4c50,#2e3033)) center/100% 100% no-repeat;
  box-shadow:0 .25vh .5vh rgba(0,0,0,.35),0 0 0 .1vh rgba(0,0,0,.25),
    inset 0 .12vh 0 rgba(255,255,255,.7),inset 0 -.12vh 0 rgba(0,0,0,.25),inset .12vh 0 0 rgba(255,255,255,.35),inset -.12vh 0 0 rgba(0,0,0,.2)}
#lift.no-panel .panel{display:none}
/* corner screws */
#lift .screw{position:absolute; width:.62vh; height:.62vh; border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#e4e5e7,#8e9195 75%); box-shadow:inset 0 0 0 .08vh rgba(0,0,0,.35),0 .06vh 0 rgba(255,255,255,.5)}
#lift .screw::before,#lift .screw::after{content:""; position:absolute; left:22%; right:22%; top:calc(50% - .04vh); height:.08vh; background:rgba(0,0,0,.55); transform:rotate(var(--rot,30deg))}
#lift .screw::before{transform:rotate(calc(var(--rot,30deg) + 90deg))}
#lift .screw.tl{top:1vh; left:1vh} #lift .screw.tr{top:1vh; right:1vh; --rot:-20deg}
#lift .screw.bl{bottom:1vh; left:1vh; --rot:75deg} #lift .screw.br{bottom:1vh; right:1vh; --rot:5deg}

/* each floor = bezel-ringed push button with an engraved label underneath */
#lift .btn{display:flex; flex-direction:column; align-items:center; gap:1.1vh; background:none; border:0; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent}
/* black push button in a thin dark-steel collar; number is backlit */
#lift .cap{position:relative; width:4.5vh; height:4.5vh; border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#3a3c3f,#1a1b1d 70%,#0e0e0f);
  box-shadow:0 .25vh .4vh rgba(0,0,0,.6),inset 0 .1vh 0 rgba(255,255,255,.18)}
#lift .cap::before{content:""; position:absolute; inset:.38vh; border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#2b2c2e,#111213 65%,#060606);
  box-shadow:inset 0 .15vh .2vh rgba(255,255,255,.12),inset 0 -.3vh .5vh rgba(0,0,0,.6);
  transition:transform .08s,filter .2s}
#lift .lbl{font:700 1.3vh/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase;
  color:#dfe1e4; text-shadow:0 -.08vh 0 rgba(0,0,0,.8); opacity:.92}
#lift .btn:hover .cap::before{filter:brightness(1.2)}
#lift .btn:active .cap::before{transform:scale(.94)}
#lift .btn.lit .num-cap{animation:liftBtnPulse .9s ease-in-out infinite}
@keyframes liftBtnPulse{50%{opacity:.45}}
#lift .btn:focus-visible .cap{outline:.25vh solid #fff; outline-offset:.4vh}
#lift .lbl{min-width:5.8vh; text-align:center; font-size:1vh; letter-spacing:.12em}
/* spare floor slots for sections still to come */
#lift .btn.ph{cursor:default}
#lift .btn.ph .cap::before{filter:brightness(.85)}
#lift .btn.ph .lbl{color:#8a8d91; letter-spacing:.3em}
#lift .fns{display:grid; grid-template-columns:repeat(2,auto); justify-content:center; gap:1.9vh 2.6vh; margin-top:1vh;
  padding-top:1.9vh; border-top:1px solid rgba(0,0,0,.45); box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#lift .btn .num-cap{font:700 2.1vh/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:-.03em; color:#f6f5f0; text-shadow:0 0 .3vh rgba(255,255,250,.85),0 0 .9vh rgba(255,255,245,.45); transition:color .15s,text-shadow .15s}
#lift .btn.ph .num-cap{color:#d9d8d2; text-shadow:0 0 .25vh rgba(255,255,250,.5)}
#lift .btn.here .num-cap,#lift .btn.lit .num-cap,#lift .btn:hover .num-cap{color:#62b4ff; text-shadow:0 0 .35vh rgba(80,165,255,0.47),0 0 1.1vh rgba(60,145,245,0.30)}
#lift.ride .btn.here:not(.lit):not(:hover) .num-cap{color:#f6f5f0; text-shadow:0 0 .3vh rgba(255,255,250,.85),0 0 .9vh rgba(255,255,245,.45)}
#lift .btn.ph:active .cap::before{transform:none}
/* lift-function row */
#lift .ico{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1;
  font:700 1.9vh/1 -apple-system,Helvetica,Arial,sans-serif; color:#3a3b3e; text-shadow:0 .08vh 0 rgba(255,255,255,.6); letter-spacing:-.1em}
#lift .btn.fn .ico svg{width:1.9vh; height:1.9vh; fill:none; stroke:#f6f5f0; filter:drop-shadow(0 0 .3vh rgba(255,255,250,.7)); transition:stroke .2s,filter .2s; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#lift .btn.fn.on .ico svg,#lift .btn.fn:hover .ico svg{stroke:#62b4ff; filter:drop-shadow(0 0 .4vh rgba(80,165,255,0.45))}

/* ===== LOBBY ===== */
#lift .lobby{position:absolute; inset:0; z-index:20; overflow:hidden; transform-origin:50% 58%;
  transform:translate(var(--lsx,0px),var(--lsy,0px))}
#lift .lobby.in{transform:scale(2.4); opacity:0; pointer-events:none;
  transition:transform 1.3s cubic-bezier(.55,0,.2,1),opacity .7s ease .55s}
#lift .lobby.gone{display:none}
#lift .lb-wall{position:absolute; inset:-2%;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%,rgba(255,232,200,.22),transparent 70%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(90deg,transparent 0 24vw,rgba(0,0,0,.25) 24vw calc(24vw + 2px)),
    linear-gradient(180deg,#3d3732,#24201d)}
#lift .lb-frame{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:40vw; height:86vh;
  padding:0 1.3vw; display:flex; flex-direction:column;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(0,0,0,.04) 1px 3px),linear-gradient(180deg,#a3a6aa,#c7c9cc 20%,#8d9094);
  box-shadow:0 0 0 .3vh #1b1a19,0 2vh 6vh rgba(0,0,0,.6)}
#lift .lb-ind{height:9vh; display:flex; align-items:center; justify-content:center; gap:.35em;
  font-family:"Doto",ui-monospace,monospace; font-weight:900; font-size:4.2vh; color:var(--led);
  text-shadow:0 0 .12em var(--led),0 0 .45em rgba(255,90,31,.55)}
#lift .lb-ind span{background:#080404; padding:.12em .35em; border-radius:.12em; box-shadow:inset 0 0 .4em #000,0 0 0 .08em #3a3a3c; min-width:1.4em; text-align:center}
#lift .lb-ind .lb-arrow{font-size:.6em; min-width:1.2em}
#lift .lb-ind .lb-arrow:empty{visibility:hidden}
#lift .lb-opening{position:relative; flex:1; overflow:hidden; background:#000}
#lift .lb-cab{position:absolute; inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,rgba(0,0,0,.05) 1px 3px),
    linear-gradient(90deg,#4b4d50,#8e9094 25%,#9a9ca0 75%,#4b4d50)}
#lift .lb-light{position:absolute; left:15%; right:15%; top:0; height:2.2%; background:#fff3df; box-shadow:0 0 6vh 2vh rgba(255,236,205,.45)}
#lift .lb-rail{position:absolute; left:8%; right:8%; top:52%; height:1.1vh; border-radius:1vh;
  background:linear-gradient(180deg,#e9eaec,#7c7f83); box-shadow:0 .8vh 1vh rgba(0,0,0,.35)}
#lift .lb-door{position:absolute; top:0; height:100%; width:50.4%; transition:transform 1s cubic-bezier(.6,0,.3,1);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.035) 1px 3px),linear-gradient(90deg,#868a8f,#c4c7cb 38%,#a2a6ab 62%,#7b7f84)}
#lift .lb-door.l{left:0; box-shadow:inset -.25vh 0 0 rgba(0,0,0,.55),1vh 0 2vh rgba(0,0,0,.4)}
#lift .lb-door.r{right:0; box-shadow:inset .2vh 0 0 rgba(255,255,255,.25),-1vh 0 2vh rgba(0,0,0,.4)}
#lift .lobby.open .lb-door.l{transform:translateX(-101%)}
#lift .lobby.open .lb-door.r{transform:translateX(101%)}
#lift .lb-shade{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 2.6vh 3vh -1.4vh rgba(0,0,0,.7),inset 1.8vh 0 2.4vh -1.2vh rgba(0,0,0,.5),inset -1.8vh 0 2.4vh -1.2vh rgba(0,0,0,.5)}
#lift .lb-call{position:absolute; left:calc(50% + 20vw + 5vw); top:58%; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:1.4vh; padding:3vh 2.4vh 2.4vh; border-radius:.5vh;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),linear-gradient(115deg,#c6c8cb,#a9acb0 38%,#cfd1d4 55%,#a2a5a9);
  box-shadow:0 .4vh .8vh rgba(0,0,0,.45),inset 0 .12vh 0 rgba(255,255,255,.7)}
#lift .lb-btn{width:7vh; height:7vh; border-radius:50%; border:0; padding:0; cursor:pointer; position:relative;
  background:conic-gradient(from 210deg,#e2e3e5,#8a8d91 18%,#d6d8db 35%,#7c7f83 55%,#e6e7e9 75%,#9a9da1 90%,#e2e3e5);
  box-shadow:0 .18vh .3vh rgba(0,0,0,.4)}
#lift .lb-btn span{position:absolute; inset:1vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font:700 2vh/1 -apple-system,Helvetica,Arial,sans-serif; color:#2f3033;
  background:radial-gradient(circle at 50% 30%,#f6f7f8,#c9cbce 55%,#a4a7ab);
  box-shadow:0 0 0 .28vh #1d1e20,inset 0 .2vh .25vh rgba(255,255,255,.9); transition:box-shadow .25s,transform .08s,color .2s}
#lift .lb-btn:hover span{filter:brightness(1.06)}
#lift .lb-btn:active span{transform:scale(.94)}
#lift .lb-btn.lit span{color:var(--led); box-shadow:0 0 0 .28vh var(--led),0 0 1.6vh .2vh rgba(255,90,31,.8),inset 0 .2vh .25vh rgba(255,255,255,.9)}
#lift .lb-btn:not(.lit) span{animation:lbInvite 2.4s ease-in-out infinite}
@keyframes lbInvite{50%{box-shadow:0 0 0 .28vh #4a3328,0 0 1vh rgba(255,90,31,.35),inset 0 .2vh .25vh rgba(255,255,255,.9)}}
#lift .lb-cap{font:700 1.2vh/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.22em; text-transform:uppercase; color:#2e2f32}
#lift .lb-plaque{position:absolute; right:calc(50% + 20vw + 4vw); top:50%; transform:translateY(-50%); text-align:right; color:#d8cfc3; max-width:22vw}
#lift .lb-title{font:600 clamp(18px,2.4vw,40px)/1.05 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:-.01em}
#lift .lb-sub{margin-top:1.4vh; font:500 11px/1.4 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; opacity:.6}

/* ===== ATMOSPHERE ===== */
/* overhead light: soft warm pool from the ceiling, gentle falloff to the edges and floor */
#lift .lightfx{position:absolute; inset:0; z-index:6; pointer-events:none;
  background:radial-gradient(ellipse 80% 65% at 50% 0%,rgba(255,224,176,.22),transparent 72%),
             radial-gradient(ellipse 120% 100% at 50% 30%,transparent 58%,rgba(0,0,0,.26) 100%),
             linear-gradient(180deg,transparent 60%,rgba(0,0,0,.12));
  mix-blend-mode:normal}
/* cab gets a touch darker as the doors shut (landing light is cut off) — follows --c */
#lift .dim{position:absolute; inset:0; z-index:7; pointer-events:none;
  background:radial-gradient(ellipse 120% 90% at 50% 15%,rgba(0,0,0,.75),#000);
  opacity:calc(var(--c,0) * var(--dark-amt,.28))}
/* very subtle flicker while the lift is moving (opacity driven by JS) */
#lift .flick{position:absolute; inset:0; z-index:7; pointer-events:none; background:#000; opacity:0}
/* subtle film grain over everything (noise tile generated in JS, jittered every frame) */
#lift .grain{position:absolute; inset:-50%; z-index:11; pointer-events:none; opacity:var(--grain,.09); mix-blend-mode:overlay;
  background-size:256px 256px; will-change:transform}
/* alarm: lights drop, red emergency light pulses */
#lift .alarmfx{position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0; mix-blend-mode:multiply;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#ff3a1a,#5a0600 70%)}
#lift.alarm .alarmfx{animation:liftAlarm .9s ease-in-out infinite}
#lift.alarm .cab{filter:brightness(.7)}
@keyframes liftAlarm{0%,100%{opacity:.95}50%{opacity:.55}}

#lift .hint{position:absolute; left:50%; bottom:3vh; transform:translateX(-50%); z-index:12; pointer-events:none;
  font:500 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#2a2a2c;
  background:rgba(255,255,255,.55); padding:9px 14px; border-radius:20px; opacity:0; transition:opacity .6s}
#lift .hint.on{opacity:1}
#lift .hint span{display:inline-block; animation:liftHint 1.4s ease-in-out infinite}
@keyframes liftHint{50%{transform:translateY(-4px)}}
/* "Floors →" tab: tucked against the right edge, opens the button panel; hidden while the camera is turned */
#lift .ftab{position:absolute; right:0; top:50%; z-index:12; display:flex; align-items:center; gap:7px; cursor:pointer;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.25); border-right:0; color:rgba(255,255,255,.8);
  font:500 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase;
  padding:9px 12px 9px 14px; border-radius:20px 0 0 20px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  opacity:0; pointer-events:none; transform:translate(0,-50%) scaleX(.6); transform-origin:right center; transition:opacity .5s, transform .5s cubic-bezier(.2,.8,.2,1), background .2s}
#lift .ftab.on{opacity:1; pointer-events:auto; transform:translate(0,-50%)}
#lift .ftab:hover{background:rgba(0,0,0,.45); color:#fff}
#lift .ftab-a{display:inline-block; animation:liftTab 1.4s ease-in-out infinite}
@keyframes liftTab{50%{transform:translateX(3px)}}
#lift.turned .ftab,#lift.ride .ftab,#lift.glancing .ftab{opacity:0; pointer-events:none}
#lift.rm .ftab-a{animation:none}
#lift .snd{position:absolute; left:2vw; bottom:2vh; z-index:12; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.75);
  font:500 11px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; padding:8px 12px; border-radius:20px; cursor:pointer}

/* ===================== MODERN THEME (minimal corporate) ===================== */
/* indicator: photographed brushed-steel plate with a flush black-glass display (CFG.indicatorImg); live text + lamps sit in the glass */
#lift .ind{width:var(--ind-w,24vh); aspect-ratio:4/1; border-radius:.2vh; background:var(--ind-img) center/100% 100% no-repeat !important;
  box-shadow:0 .2vh .5vh rgba(0,0,0,.3),0 0 0 .08vh rgba(0,0,0,.3)}
#lift .ind .digits{left:18.5%; width:63%; top:24%; height:38%;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; font-size:1.45vh; letter-spacing:.3em; text-indent:.3em;
  color:#f2f4f6; text-transform:uppercase; text-shadow:0 0 .15vh rgba(255,255,255,.5)}
#lift .ind .ghost{display:none}
#lift .tri{background:rgba(0,0,0,.28); filter:drop-shadow(0 .06vh 0 rgba(255,255,255,.55)); opacity:1}
#lift .tri.on{background:#62b4ff; filter:drop-shadow(0 0 .3vh rgba(80,165,255,0.42))}
#lift .tri.d{left:6.6%; top:42%; width:4.2%; height:16%}
#lift .tri.u{left:89.2%; top:42%; width:4.2%; height:16%}
#lift .lights{left:18.5%; width:63%; top:64%; height:8%; gap:6%}
#lift .lamp{height:45%; background:rgba(255,255,255,.13); box-shadow:none}
#lift .lamp.on{background:#62b4ff; box-shadow:0 0 .35vh rgba(80,165,255,0.40)}

/* button panel: satin brushed-steel plate (same steel as the doors), black push buttons, engraved labels */
#lift .panel{background:var(--steel-img) center/cover, linear-gradient(160deg,#c9ccd0,#9a9da2) !important; border-radius:.5vh;
  box-shadow:0 .35vh .9vh rgba(0,0,0,.28),0 0 0 .1vh rgba(0,0,0,.35),inset 0 .12vh 0 rgba(255,255,255,.55),inset 0 -.12vh 0 rgba(0,0,0,.25)}
#lift .panel::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.08))}
#lift .screw{display:none}
#lift .fns{border-top:1px solid rgba(0,0,0,.22); box-shadow:none; background:linear-gradient(180deg,rgba(255,255,255,.3) 0 1px,transparent 1px)}
/* black button inserts in a fine steel collar; backlit white numerals, red when current / selected / hovered */
#lift .cap{background:radial-gradient(circle at 50% 35%,#e6e8ea,#9ea1a5 70%); box-shadow:0 .12vh .2vh rgba(0,0,0,.35),inset 0 .08vh 0 rgba(255,255,255,.7)}
#lift .cap::before{inset:.3vh; background:radial-gradient(circle at 50% 30%,#2a2b2d,#0c0c0d 70%); box-shadow:inset 0 .12vh .2vh rgba(255,255,255,.12),inset 0 -.2vh .4vh rgba(0,0,0,.6)}
#lift .btn:hover .cap::before{filter:none}
#lift .btn:hover .cap,#lift .btn.here .cap,#lift .btn.lit .cap{box-shadow:0 .12vh .2vh rgba(0,0,0,.35),inset 0 .08vh 0 rgba(255,255,255,.7),0 0 .8vh rgba(80,165,255,0.17)}
#lift .btn .num-cap{font:500 1.9vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:0}
#lift .lbl{font:600 .95vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:.22em; color:#2c2e31; text-shadow:0 .08vh 0 rgba(255,255,255,.5); opacity:.9}
#lift .btn.ph .lbl{color:#6a6d72}
/* thinner, satin door frame */
#lift .trim{filter:saturate(.6) brightness(1.05)}

/* ===================== LEVEL SCREEN VARIANTS (CFG.indicator) ===================== */
#lift .ind2{position:relative; display:flex; align-items:center; justify-content:center}
#lift.ind-alt .ind{display:none}
#lift .ind2 .ar{width:1vh; height:.85vh; background:rgba(255,255,255,.14); transition:background .25s,filter .25s}
#lift .ind2 .ar.u{clip-path:polygon(50% 0,100% 100%,0 100%)}
#lift .ind2 .ar.d{clip-path:polygon(0 0,100% 0,50% 100%)}
#lift .ind2 .ar.on{background:#62b4ff; filter:drop-shadow(0 0 .35vh rgba(80,165,255,0.47))}
#lift.moving .ind2 .ar.on{animation:liftBlink 1s steps(1) infinite}
#lift .steelplate{background:var(--steel-img) center/cover, linear-gradient(160deg,#c9ccd0,#9a9da2);
  box-shadow:0 .25vh .6vh rgba(0,0,0,.28),0 0 0 .1vh rgba(0,0,0,.35),inset 0 .1vh 0 rgba(255,255,255,.55),inset 0 -.1vh 0 rgba(0,0,0,.25)}

/* A — DIAL: art-deco half-moon floor dial with a sweeping needle */
#lift .ind2.dial{gap:0}
#lift .dial .face{position:relative; width:12vh; height:6vh; border-radius:6vh 6vh .3vh .3vh; transform:scale(.92); transform-origin:50% 60%}
#lift .dial .face::before{content:""; position:absolute; left:.45vh; right:.45vh; top:.45vh; bottom:.3vh; border-radius:6.1vh 6.1vh .15vh .15vh;
  background:radial-gradient(ellipse at 50% 100%,#1d1e20,#0a0a0b 75%); box-shadow:inset 0 .15vh .35vh rgba(0,0,0,.9),0 .08vh 0 rgba(255,255,255,.45)}
#lift .dial .mk{position:absolute; left:50%; bottom:.35vh; width:0; height:0}
#lift .dial .mk i{position:absolute; left:-.06vh; top:-5.6vh; width:.12vh; height:.55vh; background:rgba(255,255,255,.35)}
#lift .dial .mk b{position:absolute; left:-1vh; top:-4.7vh; width:2vh; text-align:center; font:500 1.05vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
  color:rgba(255,255,255,.55); transition:color .3s,text-shadow .3s}
#lift .dial .mk.on b{color:#62b4ff; text-shadow:0 0 .4vh rgba(80,165,255,0.42)}
#lift .dial .mk.on i{background:#62b4ff}
#lift .dial .needle{position:absolute; left:calc(50% - .1vh); bottom:.35vh; width:.2vh; height:3.15vh; transform-origin:50% 100%;
  background:linear-gradient(180deg,#bfe0ff,#3a8ae8); border-radius:.1vh .1vh 0 0; box-shadow:0 0 .35vh rgba(80,165,255,0.30);
  transition:transform .7s cubic-bezier(.45,1.35,.5,1)}
#lift .dial .hub{position:absolute; left:calc(50% - .55vh); bottom:-.2vh; width:1.1vh; height:1.1vh; border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f2f3f4,#8d9094 70%); box-shadow:0 .08vh .15vh rgba(0,0,0,.6)}
#lift .dial .tag{position:absolute; left:calc(100% + 1.4vh); top:50%; transform:translateY(-50%)}
#lift .dial > .arrs{position:absolute; right:calc(100% + 1.4vh); top:50%; transform:translateY(-50%); padding:.7vh .75vh; border-radius:.2vh;
  background:linear-gradient(180deg,#141516,#070708); box-shadow:inset 0 .12vh .25vh rgba(0,0,0,.9),0 0 0 .1vh rgba(0,0,0,.35),0 .08vh 0 rgba(255,255,255,.45)}
#lift .dial .tag .nm{min-width:9.5vh; text-align:center; font:500 1.1vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:.3em; text-indent:.3em; text-transform:uppercase;
  color:#62b4ff; text-shadow:0 0 .35vh rgba(80,165,255,0.35); padding:.75vh .8vh; border-radius:.2vh;
  background:linear-gradient(180deg,#141516,#070708); box-shadow:inset 0 .12vh .25vh rgba(0,0,0,.9),0 0 0 .1vh rgba(0,0,0,.35),0 .08vh 0 rgba(255,255,255,.45)}
#lift .dial .arrs{display:flex; flex-direction:column; gap:.5vh}
#lift .dial .arrs .ar{background:rgba(255,255,255,.14)}
#lift .dial .arrs .ar.on{background:#62b4ff}

/* B — BAR: every floor engraved along one steel bar; current floor lit gold */
#lift.ind-bar .hdr{left:calc(50% - 34vh); width:68vh}
#lift .ind2.bar{gap:1.3vh; padding:0 1.4vh; height:3.6vh; border-radius:.3vh}
#lift .bar .names{display:flex; align-items:center; gap:.4vh; height:2.5vh; padding:0 .4vh; border-radius:.15vh;
  background:linear-gradient(180deg,#141516,#070708); box-shadow:inset 0 .15vh .3vh rgba(0,0,0,.9),0 .08vh 0 rgba(255,255,255,.45)}
#lift .bar .nm{position:relative; font:500 .95vh/1 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:.24em; text-indent:.24em; text-transform:uppercase;
  color:rgba(255,255,255,.26); padding:0 .9vh; transition:color .35s,text-shadow .35s}

    const settled = () => {
      if (seen || !CFG.showPanel || busy || !doorsOpen()) return;
      if (!glanced && CFG.panelGlance && !RM) glanceTimer = setTimeout(glance, Math.max(0, CFG.glanceAfterMs - 900));
    };
    const onScroll = () => {
      cancelGlance(); clearTimeout(glanceTimer); clearTimeout(settleTimer);
      settleTimer = setTimeout(settled, 900);
    };
    sc.addEventListener('scroll', onScroll, { passive: true });
    root.addEventListener('wheel', cancelGlance, { passive: true });
    if (!CFG.startClosed && !CFG.lobby) setTimeout(settled, 1500);
  }

  /* ===== FILM GRAIN ===== */
  {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 70; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    const grainEl = $('.grain'); grainEl.style.backgroundImage = `url(${c.toDataURL()})`;
    root.style.setProperty('--grain', CFG.grain);
    let gt = 0;
    const jitter = now => {   // ~24fps, like film
      if (now - gt > 41 && CFG.grain && !RM) { gt = now; grainEl.style.transform = `translate(${(Math.random() * 256) | 0}px,${(Math.random() * 256) | 0}px)`; }
      requestAnimationFrame(jitter);
    };
    if (!CFG.grain) grainEl.style.display = 'none'; else requestAnimationFrame(jitter);
  }

  /* ===== IDLE CAMERA SWAY ===== */
  // slow handheld drift: the cab shifts a touch and the vanishing point wanders, so the recess breathes
  const lobbyEl = $('.lobby');
  let lobbyActive = !!CFG.lobby;
  // travel: 1 during a panel ride; while scrolling, follows how shut the doors are × how fast you're moving
  // cursor look: the camera leans very slightly towards the pointer (smoothed)
  let lookX = 0, lookY = 0, tLookX = 0, tLookY = 0;
  root.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    tLookX = (e.clientX / innerWidth - .5) * 2; tLookY = (e.clientY / innerHeight - .5) * 2;
  });
  root.addEventListener('pointerleave', () => { tLookX = 0; tLookY = 0; });
  const flickEl = $('.flick'); let flk = 0;
  let travel = 0, scrollVel = 0, lastSc = 0, lastBuzz = 0, shakeX = 0, shakeY = 0, bump = 0;
  const floorBump = () => { bump = 1; if (CFG.haptics && navigator.vibrate) navigator.vibrate(35); };
  function sway(now) {
    // how much the cab is 'moving'
    const v = Math.abs(sc.scrollTop - lastSc); lastSc = sc.scrollTop;
    scrollVel += (Math.min(1, v / 18) - scrollVel) * .15;
    const target = root.classList.contains('moving') ? 1 : Math.min(1, Math.max(0, (cVal - .45) / .45)) * scrollVel;
    travel += (target - travel) * .12;
    bump *= .82;
    // the odd faint dip in the lights while travelling
    if (!RM && CFG.flicker && travel > .3 && Math.random() < .035 * travel) flk = (.04 + Math.random() * .06) * CFG.flicker;
    flk *= .78;
    flickEl.style.opacity = flk.toFixed(3);
    // vibration: fast jitter + a low rumble, scaled by travel
    let vx = 0, vy = 0;
    if (CFG.vibration && !RM && travel > .01) {
      const a = travel * CFG.vibration, t = now / 1000;
      // smoothed noise: a soft rumble rather than a frame-by-frame buzz
      shakeX += ((Math.random() - .5) * 2 - shakeX) * .15; shakeY += ((Math.random() - .5) * 2 - shakeY) * .15;
      vx = shakeX * 2 * a + Math.sin(t * 23) * 1 * a;
      vy = shakeY * 3 * a + Math.sin(t * 31 + 1) * 1.6 * a + bump * 4 * CFG.vibration;   // small bump as each floor passes
      // phone haptics where supported (Android); light ticks while moving
      if (CFG.haptics && navigator.vibrate && now - lastBuzz > 140 && travel > .35) { navigator.vibrate(Math.round(12 + 18 * travel)); lastBuzz = now; }
    }
    // ease towards the pointer; parked while sliding over to the panel
    const lk = RM || turned ? 0 : CFG.cursorLook;
    lookX += (tLookX * lk - lookX) * .04; lookY += (tLookY * lk - lookY) * .04;
    const lx = -lookX * 5, ly = -lookY * 3.5;                     // px the view shifts
    const lpx = lookX * 1.6, lpy = lookY * 1.2;                    // % the vanishing point shifts (depth parallax)
    vx += lx; vy += ly;
    indEl.style.setProperty('--rx', (lookX * 14 + Math.sin(now / 4300) * 3).toFixed(2));
    if (CFG.sway && !RM) {
      const t = now / 1000, k = CFG.sway;
      const x = (Math.sin(t * .23) * .6 + Math.sin(t * .41 + 1.3) * .35) * k;
      const y = (Math.sin(t * .19 + .7) * .45 + Math.sin(t * .33 + 2.1) * .25) * k;
      const r = (Math.sin(t * .17 + 2.4) * .06) * k;
      cab.style.transform = `translate(${x * 2.4 + vx}px,${y * 2.4 + vy}px) rotate(${r}deg) scale(${1 + .012 * k + .008})`;
      cab.style.perspectiveOrigin = `${50 + x * .5 + lpx}% ${50 + y * .5 + lpy}%`;
      if (lobbyActive && !lobbyEl.classList.contains('in')) {
        lobbyEl.style.setProperty('--lsx', (x * 3) + 'px'); lobbyEl.style.setProperty('--lsy', (y * 3) + 'px');
      }
    }
    else cab.style.transform = `translate(${vx}px,${vy}px) scale(1.016)`;
    requestAnimationFrame(sway);
  }
  requestAnimationFrame(sway);

  /* ===== LOBBY START ===== */
  function openCabDoors() {
    busy = true; root.classList.add('ride');
    setTimeout(() => { setC(0); doorSound(); setTimeout(() => { root.classList.remove('ride'); busy = false; }, CFG.doorMs); }, 350);
  }
  function setupLobby() {
    $('.lb-title').textContent = CFG.lobbyTitle || '';
    $('.lb-sub').textContent = CFG.lobbySub || '';
    if (CFG.lobbyWallImg) $('.lb-wall').style.background = `url(${CFG.lobbyWallImg}) center/cover`;
    if (CFG.lobbyDoorImg) root.querySelectorAll('.lb-door').forEach((d, k) => d.style.background = `url(${CFG.lobbyDoorImg}) ${k ? 'left' : 'right'} center/cover`);
    if (CFG.lobbyCabImg) $('.lb-cab').style.background = `url(${CFG.lobbyCabImg}) center/cover`;
    const topNo = floorNo(0), lbNum = $('.lb-num'), lbArrow = $('.lb-arrow');
    lbNum.textContent = '1'; lbArrow.textContent = '';
    const btn = $('.lb-btn');
    let called = false;
    btn.addEventListener('click', async () => {
      if (called) return; called = true;
      initAudio(); initAtmos(); soundOn = true; sndBtn.textContent = 'Sound on';
      click(); btn.classList.add('lit');
      // the lift comes up to you
      lbArrow.textContent = '▲'; humOn();
      for (let n = 2; n <= topNo; n++) { await sleep(T(420)); lbNum.textContent = String(n); }
      await sleep(T(300)); humOff(); ding(1); lbArrow.textContent = '';
      await sleep(T(450));
      lobbyEl.classList.add('open'); doorSound();
      await sleep(T(CFG.doorMs + 500));
      // step in
      lobbyEl.classList.add('in');
      await sleep(T(1350));
      lobbyEl.classList.add('gone'); lobbyActive = false;
      openCabDoors();
    });
  }

  /* ===== START ===== */
  if (CFG.startAtBottom) {
    sc.scrollTop = sc.scrollHeight; lastTop = sc.scrollTop;
    cur = floorNow();
    const hint = $('.hint');
    setTimeout(() => hint.classList.add('on'), 1800);
    const hideHint = () => { if (sc.scrollTop < sc.scrollHeight - sc.clientHeight - 20) { hint.classList.remove('on'); sc.removeEventListener('scroll', hideHint); } };
    sc.addEventListener('scroll', hideHint, { passive: true });
  }
  updateVisibility(); setNum(cur); markHere(cur); setC(1);
  sc.focus({ preventScroll: true });
  if (CFG.lobby) { busy = true; setupLobby(); }
  else {
    lobbyEl.classList.add('gone');
    if (CFG.startClosed) {
      // shut on load; a nudge to scroll appears until the visitor moves
      const hint = $('.hint');
      if (!CFG.startAtBottom) {
        setTimeout(() => { if (sc.scrollTop < 5) hint.classList.add('on'); }, 1600);
        const hideHint = () => { if (sc.scrollTop > 5) { hint.classList.remove('on'); sc.removeEventListener('scroll', hideHint); } };
        sc.addEventListener('scroll', hideHint, { passive: true });
      }
    } else if (CFG.openOnLoad && !RM) {
      busy = true; root.classList.add('ride');
      setTimeout(() => { setC(0); setTimeout(() => { root.classList.remove('ride'); busy = false; }, CFG.doorMs); }, 700);
    } else setC(0);
  }
  requestAnimationFrame(tick);
})();
</script>

</body></html>
